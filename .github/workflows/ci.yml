name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AAA.ERP.sln

      - name: Build
        run: dotnet build AAA.ERP.sln --no-restore --configuration Release

      - name: Nullable gate (changed .cs files on PR)
        if: github.event_name == 'pull_request'
        run: bash scripts/check-nullable-on-changed-files.sh
        env:
          GITHUB_BASE_REF: origin/${{ github.base_ref }}

      - name: Test
        run: dotnet test AAA.ERP.sln --no-restore --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Publish coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
