name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AAA.ERP.sln

      - name: Build
        run: dotnet build AAA.ERP.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test AAA.ERP.sln --no-restore --configuration Release --verbosity normal
